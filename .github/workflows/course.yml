name: course
# Push to branch `render-run`; ids listed in render.txt (one per line) render in parallel at 720p24.
on:
  push:
    branches: [render-run]
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "matrix=$(grep -v '^#' render.txt | grep . | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
  render:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        id: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hyperframes
            ~/.npm
          key: hf-course-v1
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q kokoro-onnx soundfile
          M=~/.cache/hyperframes/tts; mkdir -p $M/models $M/voices
          [ -f $M/models/kokoro-v1.0.onnx ] || curl -sL -o $M/models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f $M/voices/voices-v1.0.bin ] || curl -sL -o $M/voices/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Lint, voice, build, render
        env:
          PY: python
          WORKERS: 4
          RES: "720"
          ID: ${{ matrix.id }}
        run: time ./make.sh "$ID"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: |
            out/**/*.mp4
            out/**/*-chapters.txt
            out/*.log
          if-no-files-found: warn
